# Registra en el taller (el DVI) la construcción de dvi-image, SOLO de una versión: cuando dvi-image termina con éxito tras
# empujar una etiqueta `v*` (el taller exige la ejecución terminada), lee el digest del nombre de su artefacto y registra la
# versión del commit etiquetado, con la etiqueta en su nota, como construida con esa imagen. El taller lo comprueba en GitHub
# con su App (la ejecución, el commit, el artefacto y que sea un push de esa etiqueta en este repositorio) y lee las
# migraciones en el commit. Un push a main sin etiqueta no registra nada.
#
# Sin clave (docs/api.md §30 del DVI): se identifica con el token OIDC de GitHub Actions (`id-token: write`), pedido con la
# audiencia del taller (la que dice GET <DVI_URL>/salud en ci_oidc.audience). El taller deduce la vertical y el entregable
# del repositorio. Lo único que tiene que existir:
# - este repositorio vinculado a su vertical en el taller como el repositorio del módulo;
# - la App de GitHub del taller con acceso a este repositorio.
# Ni secretos ni variables de vertical o entregable. Opcionales: la variable DVI_URL (la URL de la API del taller, terminada
# en /v1; por defecto, https://dvi-api.taskai.work/v1) y DVI_ENTREGABLE_ID, solo si el taller dice que el repositorio sirve a
# más de un entregable (409 ci_target_ambiguous).
#
# La vía antigua sigue: si el repositorio tiene el secreto DVI_CI_TOKEN (el token de un principal del taller con `leer` y
# `publicar` sobre la vertical), se usa ese token con las variables DVI_VERTICAL y DVI_ENTREGABLE_ID, como antes. Nunca sale
# del almacén de secretos: solo va en la cabecera, desde un fichero 0600.
name: dvi-register

on:
  workflow_run:
    workflows: [dvi-image]
    types: [completed]

permissions:
  actions: read
  contents: read
  # Solo para pedir el token OIDC con la audiencia del taller; no da permiso de escritura sobre nada.
  id-token: write

jobs:
  register:
    # Solo las ejecuciones de una etiqueta: dvi-image corre en main o en etiquetas v*, y en una etiqueta head_branch es su nombre.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DVI_URL: ${{ vars.DVI_URL || 'https://dvi-api.taskai.work/v1' }}
      DVI_VERTICAL: ${{ vars.DVI_VERTICAL }}
      DVI_ENTREGABLE_ID: ${{ vars.DVI_ENTREGABLE_ID }}
    steps:
      - name: Registrar la construcción en el taller
        env:
          GH_TOKEN: ${{ github.token }}
          DVI_CI_TOKEN: ${{ secrets.DVI_CI_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test -n "$DVI_URL" || { echo "Falta DVI_URL"; exit 1; }
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]{1,60}$ ]] || { echo "No es una etiqueta de versión: $TAG"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "No es un commit: $COMMIT"; exit 1; }
          umask 077
          hdr="$(mktemp)"; resp="$(mktemp)"; trap 'rm -f "$hdr" "$resp"' EXIT
          dvi() { # dvi <método> <ruta> [cuerpo] → imprime el código HTTP en la primera línea y el cuerpo después
            curl -sS -o "$resp" -w '%{http_code}\n' -X "$1" -H @"$hdr" -H 'content-type: application/json' \
              ${3:+--data "$3"} "$DVI_URL$2"; cat "$resp"; echo; }
          fallo() { echo "$1 ($2): $(jq -c '{error, message, detalle}' <<<"$3" 2>/dev/null || echo "$3")"; exit 1; }

          name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq \
            '[.artifacts[].name | select(test("^dvi-image-sha256-[0-9a-f]{64}$"))] | if length == 1 then .[0] else error("se esperaba un artefacto dvi-image-sha256-<hex>") end')"
          digest="sha256:${name#dvi-image-sha256-}"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "Versión $TAG: imagen $repository@$digest, commit $COMMIT, ejecución $RUN_ID"

          if [ -z "${DVI_CI_TOKEN:-}" ]; then
            # Sin clave: el token OIDC de esta ejecución, con la audiencia que dice el taller.
            salud="$(curl -sS "$DVI_URL/salud")" || { echo "El taller no responde en $DVI_URL"; exit 1; }
            aud="$(jq -r '.ci_oidc.audience // empty' <<<"$salud" 2>/dev/null || true)"
            [ -n "$aud" ] || { echo "El taller ($DVI_URL) no acepta todavía la CI sin clave (GET /salud sin ci_oidc): usa el secreto DVI_CI_TOKEN con DVI_VERTICAL y DVI_ENTREGABLE_ID"; exit 1; }
            [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || { echo "Este job no puede pedir el token OIDC: falta permissions: id-token: write"; exit 1; }
            jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg a "$aud" '$a | @uri')" | jq -r '.value // empty')"
            [ -n "$jwt" ] || { echo "GitHub no dio el token OIDC"; exit 1; }
            echo "::add-mask::$jwt"
            printf 'authorization: Bearer %s\n' "$jwt" > "$hdr"
            unset jwt ACTIONS_ID_TOKEN_REQUEST_TOKEN
            cuerpo="$(jq -nc --arg c "$COMMIT" --arg t "$TAG" --arg run "$RUN_ID" --arg d "$digest" --arg repo "$repository" --arg e "${DVI_ENTREGABLE_ID:-}" \
              '{commit: $c, tag: $t, build: {ci: "github_actions", run_id: $run, digest: $d, image: {repository: $repo}}} + (if $e == "" then {} else {entregable_id: $e} end)')"
            out="$(dvi POST /ci/github/builds "$cuerpo")"
            code="$(head -1 <<<"$out")"; body="$(tail -n +2 <<<"$out")"
            case "$code" in
              201) echo "Construcción registrada: versión $(jq -r .version <<<"$body") · $TAG de $(jq -r .vertical.clave <<<"$body")/$(jq -r .entregable.clave <<<"$body"), $repository@$digest" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              200) echo "La versión $(jq -r .version <<<"$body") ya tenía esta construcción" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              *) fallo "El taller no registró la construcción" "$code" "$body" ;;
            esac
          fi

          # La vía antigua, con la clave de un principal del taller.
          for v in DVI_VERTICAL DVI_ENTREGABLE_ID; do test -n "${!v}" || { echo "Con DVI_CI_TOKEN, falta $v"; exit 1; }; done
          printf 'authorization: Bearer %s\n' "$DVI_CI_TOKEN" > "$hdr"
          unset DVI_CI_TOKEN
          base="/verticales/$DVI_VERTICAL/entregables/$DVI_ENTREGABLE_ID"

          # La versión del commit etiquetado, con la etiqueta en su nota: nueva (201), la misma (200) o ya registrada con otra
          # nota o estado (409 con su número).
          out="$(dvi POST "$base/versiones" "$(jq -nc --arg r "$GITHUB_REPOSITORY" --arg c "$COMMIT" --arg t "$TAG" '{repo: $r, commit: $c, nota: $t}')")"
          code="$(head -1 <<<"$out")"; body="$(tail -n +2 <<<"$out")"
          case "$code" in
            200|201) version="$(jq -r '.version' <<<"$body")" ;;
            409) version="$(jq -r 'select(.error == "conflicto_idempotencia") | .detalle.version // empty' <<<"$body")" ;;
            *) version="" ;;
          esac
          [[ "$version" =~ ^[0-9]+$ ]] || fallo "No se pudo registrar la versión" "$code" "$body"
          echo "Versión $version"

          # La construcción (§22.1). Si la versión ya tiene una, vale solo si es este mismo digest.
          out="$(dvi POST "$base/versiones/$version/estados" "$(jq -nc --arg run "$RUN_ID" --arg d "$digest" --arg repo "$repository" \
            '{estado: "construido", build: {ci: "github_actions", run_id: $run, digest: $d, image: {repository: $repo}}}')")"
          code="$(head -1 <<<"$out")"; body="$(tail -n +2 <<<"$out")"
          if [ "$code" = 201 ]; then echo "Construcción registrada: versión $version · $TAG, $repository@$digest" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$code" = 409 ] && [ "$(jq -r .error <<<"$body")" = transicion_invalida ]; then
            out="$(dvi GET "/verticales/$DVI_VERTICAL/entregables")"; body="$(tail -n +2 <<<"$out")"
            ya="$(jq -r --arg e "$DVI_ENTREGABLE_ID" --argjson v "$version" '.entregables[] | select(.id == $e) | .versiones[] | select(.version == $v) | .estados[] | select(.build != null) | .build.digest' <<<"$body")"
            if [ "$ya" = "$digest" ]; then echo "La versión $version ya tenía esta construcción"; exit 0; fi
            echo "La versión $version ya tiene otra construcción (${ya:-ninguna con build}) o no admite una: no se registra"; exit 1
          fi
          fallo "El taller no registró la construcción" "$code" "$body"
